<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Pixel Art Editor</title>
	</head>
	<body></body>

	<div>Hello, world</div>
	<script>
		class Picture {
			constructor(width, height, pixels) {
				this.width = width;
				this.height = height;
				this.pixels = pixels;
			}

			static empty(width, height, color) {
				let pixels = new Array(width * height).fill(color);
				return new Picture(width, height, pixels);
			}

			pixel(x, y) {
				return this.pixels[x + y * this.width];
			}

			draw(pixels) {
				let copy = this.pixels.slice();
				for (let { x, y, color } of pixels) {
					copy[x + y * this.width] = color;
				}

				return new Picture(this.width, this.height, copy);
			}
		}

		function updateState(state, action) {
			return { ...state, ...action };
		}

		function elt(type, props, ...children) {
			let dom = document.createElement(type);
			if (props) Object.assign(dom, props);
			for (let child of children) {
				if (typeof child != 'string') dom.appendChild(child);
				else dom.appendChild(document.createTextNode(child));
			}
			return dom;
		}

		class PictureCanvas {
			constructor(picture, pointerDown, state) {
				this.dom = elt('canvas', {
					onmousedown: (event) => this.mouse(event, pointerDown, state),
					ontouchstart: (event) => this.touch(event, pointerDown, state),
				});
				this.zoom = state.zoom;
				this.syncState(picture, state);
			}

			syncState(picture, state) {
				if (this.picture == picture && this.zoom == state.zoom) return;
				drawPicture(picture, this.dom, state.zoom, this.picture);
				this.picture = picture;
			}
		}
		let scale = 1;
		function drawPicture(picture, canvas, zoom, previous) {
			if (
				previous == null ||
				previous.width != picture.width ||
				previous.height != picture.height ||
				canvas.zoom !== zoom
			) {
				canvas.width = picture.width * zoom;
				canvas.zoom = zoom;
				canvas.height = picture.height * zoom;
				previous = null;
			}
			let cx = canvas.getContext('2d');
			cx.beginPath();
			for (let y = 0; y < picture.height; y++) {
				for (let x = 0; x < picture.width; x++) {
					let color = picture.pixel(x, y);
					if (previous == null || previous.pixel(x, y) != color) {
						cx.fillStyle = color;
						cx.fillRect(x * zoom, y * zoom, zoom, zoom);
					}
				}
			}
		}

		PictureCanvas.prototype.mouse = function (downEvent, onDown, state) {
			if (downEvent.button != 0) return;
			let pos = pointerPosition(downEvent, this.dom, state.zoom);
			let onMove = onDown(pos);
			if (!onMove) return;
			let move = (moveEvent) => {
				if (moveEvent.buttons == 0) {
					this.dom.removeEventListener('mousemove', move);
				} else {
					let newPos = pointerPosition(moveEvent, this.dom, state.zoom);
					if (newPos.x == pos.x && newPos.y == pos.y) return;
					pos = newPos;
					onMove(newPos);
				}
			};
			this.dom.addEventListener('mousemove', move);
		};

		function pointerPosition(pos, domNode, zoom) {
			let rect = domNode.getBoundingClientRect();
			return {
				x: Math.floor((pos.clientX - rect.left) / zoom),
				y: Math.floor((pos.clientY - rect.top) / zoom),
			};
		}

		PictureCanvas.prototype.touch = function (startEvent, onDown, state) {
			let pos = pointerPosition(startEvent.touches[0], this.dom, state.zoom);
			let onMove = onDown(pos);
			startEvent.preventDefault();
			if (!onMove) return;
			let move = (moveEvent) => {
				let newPos = pointerPosition(
					moveEvent.touches[0],
					this.dom,
					state.zoom
				);
				if (newPos.x == pos.x && newPos.y == pos.y) return;
				pos = newPos;
				onMove(newPos);
			};

			let end = () => {
				this.dom.removeEventListener('touchmove', move);
				this.dom.removeEventListener('touchend', end);
			};
			this.dom.addEventListener('touchmove', move);
			this.dom.addEventListener('touchend', end);
		};

		class PixelEditor {
			constructor(state, config) {
				let { tools, sketches, controls, dispatch } = config;
				this.state = state;
				this.sketch = sketches[this.state.sketch];
				this.canvas = new PictureCanvas(
					state.picture,
					(pos) => {
						let tool = tools[this.state.tool];
						try {
							let onMove = tool(pos, this.state, dispatch);
							if (onMove) return (pos) => onMove(pos, this.state);
						} catch (error) {
							alert(`Don't "fill" from Corners OR "Drag" with "fill"`);
						}
					},
					this.state
				);
				this.controls = controls.map((Control) => new Control(state, config));
				this.dom = elt(
					'div',
					{
						tabIndex: 0,
						onkeydown: (event) => {
							this.keyDown(event, config);
						},
					},
					this.canvas.dom,
					elt('br'),
					...this.controls.reduce((a, c) => a.concat(' ', c.dom), [])
				);
			}

			keyDown(event, config) {
				if (event.ctrlKey || event.metaKey) {
					event.preventDefault();
					if (event.key == 'z') {
						config.dispatch({ undo: true });
					} else {
						config.dispatch({ redo: true });
					}
				} else if (!event.shiftKey) {
					for (let tool of Object.keys(config.tools)) {
						if (tool[0] == event.key) {
							event.preventDefault();
							config.dispatch({ tool });
							return;
						}
					}
				} else {
					for (let sketch of Object.values(config.sketches)) {
						if (sketch[0] == event.key && event.shiftKey) {
							event.preventDefault();
							config.dispatch({ sketch: sketch });
							return;
						}
					}
				}
			}

			syncState(state) {
				console.log('zoom = ' + state.zoom);
				this.state = state;
				this.canvas.syncState(state.picture, state);
				for (let ctrl of this.controls) ctrl.syncState(this.state);
			}
		}

		class ToolSelect {
			constructor(state, { tools, dispatch }) {
				this.select = elt(
					'select',
					{
						onchange: () => dispatch({ tool: this.select.value }),
					},
					...Object.keys(tools).map((name) =>
						elt(
							'option',
							{
								selected: name == state.tool,
							},
							name
						)
					)
				);
				this.dom = elt('label', null, '🖌 Tool: ', this.select);
			}

			syncState(state) {
				this.select.value = state.tool;
			}
		}

		class SketchSelect {
			constructor(state, { sketches, dispatch }) {
				this.select = elt(
					'select',
					{
						onchange: () => {
							dispatch({ sketch: this.select.value });
						},
					},
					...Object.values(sketches).map((name) =>
						elt('option', { selected: name == state.sketch }, name)
					)
				);
				this.dom = elt('label', null, 'Sketch: ', this.select);
			}

			syncState(state) {
				this.select.value = state.sketch;
			}
		}

		function applyBrush(points, state) {
			let brushSize = null;
			if (state.sketch == 'Marker') {
				if (state.tool === 'erase') {
					brushSize = 30;
				} else {
					brushSize = 3;
				}
			} else {
				if (state.tool === 'erase') brushSize = 20;
			}

			let result = [];
			for (let p of points) {
				for (let dx = 0; dx <= brushSize; dx++) {
					for (let dy = 0; dy < brushSize; dy++) {
						result.push({ x: p.x + dx, y: p.y + dy, color: p.color });
					}
				}
			}
			if (brushSize) return result;

			return points;
		}

		class ColorSelect {
			constructor(state, { dispatch }) {
				this.input = elt('input', {
					type: 'color',
					value: state.color,
					onchange: () => dispatch({ color: this.input.value }),
				});
				this.dom = elt('label', null, '🎨 Color: ', this.input);
			}

			syncState(state) {
				this.input.value = state.color;
			}
		}

		function drawLine(from, to, color) {
			let points = [];

			if (Math.abs(from.x - to.x) > Math.abs(from.y - to.y)) {
				if (from.x > to.x) [from, to] = [to, from];
				let slope = (to.y - from.y) / (to.x - from.x);
				for (let { x, y } = from; x <= to.x; x++) {
					points.push({ x, y: Math.round(y), color });
					y += slope;
				}
			} else {
				if (from.y > to.y) [from, to] = [to, from];
				let slope = (to.x - from.x) / (to.y - from.y);
				for (let { x, y } = from; y <= to.y; y++) {
					points.push({ x: Math.round(x), y, color });
					x += slope;
				}
			}
			return points;
		}

		function draw(pos, state, dispatch, getColor = () => state.color) {
			function connect(newPos, state) {
				let color = getColor();
				let line = drawLine(pos, newPos, color, state);
				pos = newPos;
				dispatch({ picture: state.picture.draw(applyBrush(line, state)) });
			}
			connect(pos, state);
			return connect;
		}

		function line(pos, state, dispatch) {
			return (end) => {
				let line = drawLine(pos, end, state.color);
				dispatch({ picture: state.picture.draw(applyBrush(line, state)) });
			};
		}

		function rectangle(start, state, dispatch) {
			function drawRectangle(pos) {
				let xStart = Math.min(start.x, pos.x);
				let yStart = Math.min(start.y, pos.y);
				let xEnd = Math.max(start.x, pos.x);
				let yEnd = Math.max(start.y, pos.y);
				let drawn = [];

				for (let y = yStart; y <= yEnd; y++) {
					for (let x = xStart; x <= xEnd; x++) {
						drawn.push({ x, y, color: state.color });
					}
				}
				dispatch({ picture: state.picture.draw(applyBrush(drawn, state)) });
			}
			drawRectangle(start);
			return drawRectangle;
		}

		let around = [
			{ dx: -1, dy: 0 },
			{ dx: 1, dy: 0 },
			{ dx: 0, dy: -1 },
			{ dx: 0, dy: 1 },
		];

		function fill({ x, y }, state, dispatch) {
			let targetColor = state.picture.pixel(x, y);

			let drawn = [{ x, y, color: state.color }];
			let visited = new Set();
			for (let done = 0; done < drawn.length; done++) {
				for (let { dx, dy } of around) {
					let x = drawn[done].x + dx,
						y = drawn[done].y + dy;
					if (
						x >= 0 &&
						x < state.picture.width &&
						y >= 0 &&
						y < state.picture.height &&
						!visited.has(x + ',' + y) &&
						state.picture.pixel(x, y) == targetColor
					) {
						drawn.push({ x, y, color: state.color });
						visited.add(x + ',' + y);
					}
				}
			}
			dispatch({ picture: state.picture.draw(drawn), tool: 'draw' });
		}

		function circle(pos, state, dispatch) {
			function drawCircle(to) {
				let radius = Math.sqrt((to.x - pos.x) ** 2 + (to.y - pos.y) ** 2);
				let radiusC = Math.ceil(radius);
				let drawn = [];
				for (let dy = -radiusC; dy <= radiusC; dy++) {
					for (let dx = -radiusC; dx <= radiusC; dx++) {
						let dist = Math.sqrt(dx ** 2 + dy ** 2);
						if (dist > radius) continue;
						let y = pos.y + dy,
							x = pos.x + dx;
						if (
							y < 0 ||
							y >= state.picture.height ||
							x < 0 ||
							x >= state.picture.width
						)
							continue;
						drawn.push({ x, y, color: state.color });
					}
				}
				dispatch({ picture: state.picture.draw(applyBrush(drawn, state)) });
			}
			drawCircle(pos);
			return drawCircle;
		}

		function erase(pos, state, dispatch) {
			return draw(pos, state, dispatch, () => '#f0f0f0');
		}

		function pick(pos, state, dispatch) {
			dispatch({ color: state.picture.pixel(pos.x, pos.y) });
		}

		class SaveButton {
			constructor(state) {
				this.picture = state.picture;
				this.dom = elt(
					'button',
					{
						onclick: () => this.save(),
					},
					'💾 Save'
				);
			}
			save() {
				let canvas = elt('canvas');
				drawPicture(this.picture, canvas, 1);
				let link = elt('a', {
					href: canvas.toDataURL(),
					download: 'pixelart.png',
				});
				document.body.appendChild(link);
				link.click();
				link.remove();
			}
			syncState(state) {
				this.picture = state.picture;
			}
		}

		class LoadButton {
			constructor(_, { dispatch }) {
				this.dom = elt(
					'button',
					{
						onclick: () => startLoad(dispatch),
					},
					'📁 Load'
				);
			}
			syncState() {}
		}

		function startLoad(dispatch) {
			let input = elt('input', {
				type: 'file',
				onchange: () => finishLoad(input.files[0], dispatch),
			});
			document.body.appendChild(input);
			input.click();
			input.remove();
		}

		function finishLoad(file, dispatch) {
			if (file == null) return;
			let reader = new FileReader();
			reader.addEventListener('load', () => {
				let image = elt('img', {
					onload: () =>
						dispatch({
							picture: pictureFromImage(image),
						}),
					src: reader.result,
				});
			});
			reader.readAsDataURL(file);
		}

		function pictureFromImage(image) {
			let width = Math.min(1000, image.width);
			let height = Math.min(400, image.height);
			let canvas = elt('canvas', { width, height });
			let cx = canvas.getContext('2d');
			cx.drawImage(image, 0, 0);
			let pixels = [];
			let { data } = cx.getImageData(0, 0, width, height);

			function hex(n) {
				return n.toString(16).padStart(2, '0');
			}
			for (let i = 0; i < data.length; i += 4) {
				let [r, g, b] = data.slice(i, i + 3);
				pixels.push('#' + hex(r) + hex(g) + hex(b));
			}
			return new Picture(width, height, pixels);
		}

		function historyUpdateState(state, action) {
			if (action.undo) {
				if (state.done.length == 0) return state;
				return {
					...state,
					picture: state.done[0],
					redone: [state.picture, ...state.redone],
					done: state.done.slice(1),
					zoom: state.zoom,
					doneAt: 0,
				};
			} else if (action.redo) {
				if (state.redone.length == 0) return state;
				return {
					...state,
					picture: state.redone[0],
					done: [state.picture, ...state.done],
					redone: state.redone.slice(1),
					zoom: state.zoom,
					doneAt: 0,
				};
			} else if (action.picture && state.doneAt < Date.now() - 1000) {
				return {
					...state,
					...action,
					done: [state.picture, ...state.done],
					zoom: state.zoom,
					doneAt: Date.now(),
				};
			} else {
				return { ...state, ...action };
			}
		}

		class UndoButton {
			constructor(state, { dispatch }) {
				this.dom = elt(
					'button',
					{
						onclick: () => dispatch({ undo: true }),
						disabled: state.done.length == 0,
					},
					'⮪ Undo'
				);
			}
			syncState(state) {
				this.dom.disabled = state.done.length == 0;
			}
		}

		class RedoButton {
			constructor(state, { dispatch }) {
				this.dom = elt(
					'button',
					{
						onclick: () => {
							dispatch({ redo: true });
						},
						disabled: state.redone.length == 0,
					},
					'↪️ Redo'
				);
			}

			syncState(state) {
				this.dom.disabled = state.redone.length === 0;
			}
		}

		class EraseButton {
			constructor(_, { dispatch }) {
				this.input = elt('input', {
					type: 'checkbox',
					onchange: () => {
						if (this.input.checked) dispatch({ tool: 'erase' });
						else dispatch({ tool: 'draw' });
					},
				});

				this.dom = elt('label', null, 'Erase', this.input);
			}
			syncState(state) {
				if (state.tool === 'erase') this.input.checked = true;
				else this.input.checked = false;
			}
		}

		class EraseAllButton {
			constructor(state, { dispatch }) {
				this.dom = elt(
					'button',
					{
						onclick: () => {
							this.eraseAll(state, dispatch);
						},
					},
					'Erase All'
				);
			}

			eraseAll(state, dispatch) {
				dispatch({ picture: Picture.empty(1000, 400, '#f0f0f0') });
			}

			syncState() {}
		}

		class ZoomControls {
			constructor(state, { dispatch }) {
				this.zoom = state.zoom;
				this.dom = elt(
					'div',
					null,
					elt(
						'button',
						{
							onclick: () => {
								dispatch({ zoom: Math.min(this.zoom * 1.1, 32) });
							},
						},
						'🔍+'
					),
					elt(
						'button',
						{
							onclick: () => {
								dispatch({ zoom: Math.max(this.zoom / 1.1, 1) });
							},
						},
						'🔍-'
					)
				);
			}

			syncState(state) {
				this.zoom = state.zoom;
			}
		}

		let startState = {
			tool: 'draw',
			sketch: 'Pencil',
			color: '#000000',
			picture: Picture.empty(1000, 400, '#f0f0f0'),
			redone: [],
			done: [],
			zoom: 1,
			doneAt: 0,
		};

		let baseTools = { draw, fill, rectangle, pick, circle, line, erase };
		let baseSketches = { marker: 'Marker', pencil: 'Pencil' };
		let baseControls = [
			ToolSelect,
			ColorSelect,
			SketchSelect,
			SaveButton,
			LoadButton,
			UndoButton,
			RedoButton,
			EraseButton,
			EraseAllButton,
			ZoomControls,
		];

		function startPixelEditor({
			state = startState,
			tools = baseTools,
			sketches = baseSketches,
			controls = baseControls,
		}) {
			let app = new PixelEditor(state, {
				tools,
				sketches,
				controls,
				dispatch(action) {
					state = historyUpdateState(state, action);
					app.syncState(state);
				},
			});
			return app.dom;
		}
		document.querySelector('div').appendChild(startPixelEditor({}));
	</script>
</html>
